<style>
.ad-fragment {
  box-sizing: border-box;
  max-width: 1240px;
  margin: 0 auto;
  padding: 8px 12px 16px;
  color: #000;
  font-family: sans-serif;
  font-size: 20px;
  line-height: 1.22;
}
.ad-fragment *, .ad-fragment *::before, .ad-fragment *::after { box-sizing: border-box; }
.ad-fragment .content-wrapper {
  max-width: 1240px;
  margin: 0 auto;
  padding: 0;
}
.ad-fragment h1 {
  margin: 0 0 10px;
  font-size: 34px;
  line-height: 1.06;
  font-weight: 700;
}
.ad-fragment p {
  margin: 0 0 8px;
}
.ad-fragment .text-block {
  max-width: 900px;
  margin: 0 auto 12px;
}
.ad-fragment .gallery {
  display: grid;
  gap: 14px;
  align-items: start;
  margin: 10px auto 0;
  grid-template-columns: repeat(3, minmax(0, 1fr));
}
.ad-fragment figure {
  margin: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.ad-fragment img {
  display: block;
  max-width: 100%;
  width: auto;
  height: auto;
  max-height: 520px;
  object-fit: contain;
  border: 6px solid #000;
  border-radius: 6px;
  background: transparent;
  filter: sepia(0.20) brightness(1.0) contrast(1) drop-shadow(0 0 10px rgba(255,220,100,0.15));
}
@media (max-width: 1100px) {
  .ad-fragment { font-size: 18px; }
  .ad-fragment h1 { font-size: 31px; }
  .ad-fragment .gallery { grid-template-columns: 1fr; }
  .ad-fragment img { max-height: none; width: 100%; }
}
</style>
<div class="ad-fragment">
  <div class="content-wrapper">
    <div class="page">
      <div class="text-block">
        <h1>Newspapers Covered the War</h1>
      </div>
      <section class="gallery">
        <figure>
          <img src="Vietnam/img_1049_tonemapped.tif" alt="Vietnam War newspaper image"/>
        </figure>
        <figure>
          <img src="Vietnam/img_1053_tonemapped.tif" alt="Vietnam War newspaper image"/>
        </figure>
        <figure>
          <img src="Vietnam/img_1050_tonemapped.tif" alt="Vietnam War newspaper image"/>
        </figure>
      </section>
    </div>
  </div>
</div>
