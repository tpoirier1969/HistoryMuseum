<style>
.ad-fragment {
  --ad-work-w: 1260px;
  --ad-text-w: 960px;
  --ad-gap: 18px;
  --ad-border: 6px solid #111;
  --ad-radius: 6px;
  box-sizing: border-box;
  max-width: var(--ad-work-w);
  margin: 0 auto;
  padding: 8px 16px 18px;
  color: #000;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 20px;
  line-height: 1.25;
}
.ad-fragment *, .ad-fragment *::before, .ad-fragment *::after { box-sizing: border-box; }
.ad-fragment .content-wrapper {
  width: 100%;
  max-width: 1220px;
  margin: 0 auto;
}
.ad-fragment h1 {
  margin: 0 0 10px;
  color: #000;
  font-size: 34px;
  line-height: 1.08;
  font-weight: 700;
}
.ad-fragment p { margin: 0 0 9px; }
.ad-fragment em { font-style: italic; }
.ad-fragment .lead-text,
.ad-fragment .header,
.ad-fragment .bio-text,
.ad-fragment .text-block {
  width: min(var(--ad-text-w), 100%);
  max-width: min(var(--ad-text-w), 100%);
  margin: 0 auto 14px;
  text-align: center;
}
.ad-fragment .lead-text.wide,
.ad-fragment .header.wide,
.ad-fragment .bio-text.wide {
  width: min(1040px, 100%);
  max-width: min(1040px, 100%);
}
.ad-fragment .role-note {
  margin: 0 0 8px;
  font-style: italic;
  white-space: pre-line;
}
.ad-fragment .center-stage {
  min-height: min(650px, calc(100vh - 245px));
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}
.ad-fragment .text-only {
  width: min(960px, 100%);
  text-align: center;
  font-size: 23px;
  line-height: 1.24;
}
.ad-fragment .text-only h1 {
  font-size: 40px;
  line-height: 1.06;
  margin-bottom: 12px;
}
.ad-fragment .visual-area {
  width: 100%;
  min-height: 0;
  display: flex;
  justify-content: center;
  align-items: center;
}
.ad-fragment .split-layout {
  width: 100%;
  display: grid;
  grid-template-columns: minmax(0, .9fr) minmax(480px, 1fr);
  gap: 22px;
  justify-content: center;
  align-items: center;
}
.ad-fragment .image-grid,
.ad-fragment .video-grid,
.ad-fragment .media-stack {
  width: 100%;
  display: grid;
  gap: var(--ad-gap);
  justify-content: center;
  justify-items: center;
  align-items: start;
}
.ad-fragment .image-grid.two,
.ad-fragment .video-grid.two,
.ad-fragment .media-stack.two {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
.ad-fragment .image-grid.three,
.ad-fragment .video-grid.three,
.ad-fragment .media-stack.three {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}
.ad-fragment .video-grid.four,
.ad-fragment .image-grid.four {
  width: min(1080px, 100%);
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
.ad-fragment figure,
.ad-fragment .video-item {
  margin: 0;
  padding: 0;
  min-width: 0;
  max-width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.ad-fragment img,
.ad-fragment video {
  display: block;
  width: 100%;
  height: auto;
  max-width: 100%;
  object-fit: contain;
  border: var(--ad-border);
  border-radius: var(--ad-radius);
  background: #000;
}
.ad-fragment img { background: transparent; }
.ad-fragment .image-grid.two img,
.ad-fragment .media-stack.two img { max-height: 455px; }
.ad-fragment .image-grid.three img,
.ad-fragment .media-stack.three img { max-height: 360px; }
.ad-fragment .image-grid.four img { max-height: 295px; }
.ad-fragment video { max-height: 360px; }
.ad-fragment .video-grid.two video { max-height: 390px; }
.ad-fragment .video-grid.three video { max-height: 300px; }
.ad-fragment .single-video {
  width: min(760px, 100%);
  margin: 20px auto 0;
}
.ad-fragment .video-title,
.ad-fragment figcaption,
.ad-fragment .caption {
  display: block;
  width: 100%;
  max-width: 100%;
  margin: 1px auto 0;
  padding: 0;
  color: #000;
  font-size: 14px;
  line-height: 1.08;
  font-style: italic;
  text-align: center;
}
.ad-fragment .legacy-link {
  display: inline-block;
  color: #000;
  font-weight: 700;
  text-decoration: underline;
}
.ad-fragment audio {
  width: 100%;
  max-width: 560px;
}
@media (max-width: 1050px) {
  .ad-fragment { font-size: 18px; }
  .ad-fragment .center-stage { min-height: 0; }
  .ad-fragment .split-layout,
  .ad-fragment .image-grid.two,
  .ad-fragment .image-grid.three,
  .ad-fragment .image-grid.four,
  .ad-fragment .video-grid.two,
  .ad-fragment .video-grid.three,
  .ad-fragment .video-grid.four,
  .ad-fragment .media-stack.two,
  .ad-fragment .media-stack.three {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .ad-fragment .text-only h1 { font-size: 36px; }
  .ad-fragment img,
  .ad-fragment video { max-height: none !important; }
}
</style>
