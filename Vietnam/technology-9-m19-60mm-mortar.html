
<div class="ad-fragment technology-9-panel"><div class="content-wrapper center-stage"><section class="text-only"><h1>M19 60mm Mortar</h1><p>The common field support weapon fired up to 30 high-explosive, smoke, or illumination rounds per minute with a range of 45 to 2,000 yards. It could be mounted or held by hand.</p></section></div></div>
