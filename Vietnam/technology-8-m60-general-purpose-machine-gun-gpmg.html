<section class="lead-text left wide"><h1>M60 General Purpose Machine Gun (GPMG)</h1><p>Light and deadly, with up to 550 high-speed bullets, the M60 used a gas-powered belt-fed system and had a range of over 1,900 yards. Its shortcoming was that the weight of the cartridge belts limited the amount of ammo one could carry.</p></section>
