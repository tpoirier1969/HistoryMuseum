<style>
.ad-fragment {
  --ad-work-w: 1260px;
  --ad-text-w: 960px;
  --ad-gap: 18px;
  --ad-border: 6px solid #111;
  --ad-radius: 6px;
  box-sizing: border-box;
  max-width: var(--ad-work-w);
  margin: 0 auto;
  padding: 8px 16px 18px;
  color: #000;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 20px;
  line-height: 1.25;
}
.ad-fragment *, .ad-fragment *::before, .ad-fragment *::after { box-sizing: border-box; }
.ad-fragment .content-wrapper {
  width: 100%;
  max-width: 1220px;
  margin: 0 auto;
}
.ad-fragment h1 {
  margin: 0 0 10px;
  color: #000;
  font-size: 34px;
  line-height: 1.08;
  font-weight: 700;
}
.ad-fragment p { margin: 0 0 9px; }
.ad-fragment .lead-text,
.ad-fragment .header,
.ad-fragment .bio-text,
.ad-fragment .text-block,
.ad-fragment .plain-text {
  width: min(var(--ad-text-w), 100%);
  max-width: min(var(--ad-text-w), 100%);
  margin: 0 auto 14px;
  text-align: center;
}
.ad-fragment .lead-text.wide,
.ad-fragment .header.wide,
.ad-fragment .bio-text.wide {
  width: min(1040px, 100%);
  max-width: min(1040px, 100%);
}
.ad-fragment .role-note {
  margin: 0 0 8px;
  font-style: italic;
  white-space: pre-line;
}
.ad-fragment .center-stage {
  min-height: min(650px, calc(100vh - 245px));
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}
.ad-fragment .text-only {
  width: min(940px, 100%);
  text-align: center;
  font-size: 23px;
  line-height: 1.24;
}
.ad-fragment .text-only h1 {
  font-size: 40px;
  line-height: 1.06;
  margin-bottom: 12px;
}
.ad-fragment .visual-area {
  width: 100%;
  min-height: 0;
  display: flex;
  justify-content: center;
  align-items: center;
}
.ad-fragment .split-layout {
  width: 100%;
  display: grid;
  grid-template-columns: minmax(0, .92fr) minmax(420px, 1fr);
  gap: 22px;
  justify-content: center;
  align-items: center;
}
.ad-fragment .split-layout.media-first {
  grid-template-columns: minmax(500px, 1fr) minmax(0, .82fr);
}
.ad-fragment .image-grid,
.ad-fragment .gallery,
.ad-fragment .media-stack {
  width: 100%;
  display: grid;
  gap: var(--ad-gap);
  justify-content: center;
  justify-items: center;
  align-items: start;
}
.ad-fragment .image-grid.two,
.ad-fragment .gallery.two,
.ad-fragment .media-stack.two {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
.ad-fragment .image-grid.three,
.ad-fragment .gallery.three,
.ad-fragment .media-stack.three {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}
.ad-fragment .image-grid.four,
.ad-fragment .gallery.four {
  width: min(1060px, 100%);
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
.ad-fragment .image-grid.six,
.ad-fragment .gallery.six {
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px 16px;
}
.ad-fragment .image-stack {
  width: min(980px, 100%);
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: center;
}
.ad-fragment figure {
  margin: 0;
  padding: 0;
  min-width: 0;
  max-width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.ad-fragment img {
  display: block;
  width: auto;
  height: auto;
  max-width: 100%;
  object-fit: contain;
  border: var(--ad-border);
  border-radius: var(--ad-radius);
  background: transparent;
}
.ad-fragment figcaption,
.ad-fragment .caption {
  display: block;
  width: 100%;
  max-width: 100%;
  margin: 1px auto 0;
  padding: 0;
  color: #000;
  font-size: 14px;
  line-height: 1.08;
  font-style: italic;
  text-align: center;
}
.ad-fragment .image-grid.two img,
.ad-fragment .gallery.two img,
.ad-fragment .media-stack.two img { max-height: 455px; }
.ad-fragment .image-grid.three img,
.ad-fragment .gallery.three img,
.ad-fragment .media-stack.three img { max-height: 365px; }
.ad-fragment .image-grid.four img,
.ad-fragment .gallery.four img { max-height: 295px; }
.ad-fragment .image-grid.six img,
.ad-fragment .gallery.six img { max-height: 225px; }
.ad-fragment .single-hero img { max-height: 560px; }
.ad-fragment .media-card-grid {
  width: min(1020px, 100%);
  display: grid;
  gap: 16px;
  justify-content: center;
  justify-items: stretch;
  align-items: stretch;
}
.ad-fragment .media-card-grid.two { grid-template-columns: repeat(2, minmax(260px, 1fr)); }
.ad-fragment .media-card-grid.three { grid-template-columns: repeat(3, minmax(220px, 1fr)); }
.ad-fragment .media-card-grid.four { grid-template-columns: repeat(2, minmax(260px, 1fr)); }
.ad-fragment .media-link,
.ad-fragment .media-video,
.ad-fragment .media-audio,
.ad-fragment .media-document {
  min-height: 126px;
  padding: 14px;
  border: var(--ad-border);
  border-radius: var(--ad-radius);
  color: #000;
  text-decoration: none;
  background: transparent;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 8px;
  text-align: center;
}
.ad-fragment .media-icon {
  display: block;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: .06em;
}
.ad-fragment .media-title {
  font-size: 18px;
  line-height: 1.14;
}
.ad-fragment audio {
  width: 100%;
  max-width: 560px;
}
@media (max-width: 1050px) {
  .ad-fragment { font-size: 18px; }
  .ad-fragment .center-stage { min-height: 0; }
  .ad-fragment .split-layout,
  .ad-fragment .split-layout.media-first,
  .ad-fragment .image-grid.two,
  .ad-fragment .image-grid.three,
  .ad-fragment .image-grid.four,
  .ad-fragment .image-grid.six,
  .ad-fragment .gallery.two,
  .ad-fragment .gallery.three,
  .ad-fragment .gallery.four,
  .ad-fragment .gallery.six,
  .ad-fragment .media-stack.two,
  .ad-fragment .media-stack.three,
  .ad-fragment .media-card-grid.two,
  .ad-fragment .media-card-grid.three,
  .ad-fragment .media-card-grid.four {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .ad-fragment .text-only h1 { font-size: 36px; }
  .ad-fragment img { max-height: none !important; }
}
</style>

<div class="ad-fragment upper-1-panel">
  <div class="content-wrapper center-stage">
    <section class="text-only">
      <h1>Manpower and Lives</h1>
    </section>
  </div>
</div>
