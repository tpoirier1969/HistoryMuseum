<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Civil War Media</title>
  <style>
    .content-wrapper {
      max-width: 1380px;
      margin: 0 auto;
      padding: 24px 18px 40px;
      color: black;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 20px;
      min-height: 760px;
      display: flex;
      align-items: center;
    }

    .profile-layout {
      width: min(1000px, 100%);
      margin: 0 auto;
    }

    img.with-border {
      border: 6px solid black;
      border-radius: 6px;
      filter: sepia(0.20) brightness(1.0) contrast(1) drop-shadow(0 0 10px rgba(255, 220, 100, 0.15));
      flex-shrink: 0;
    }

    .bio-text {
      max-width: 900px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 34px;
      line-height: 1.08;
      text-align: center;
    }

    p {
      margin: 0;
      line-height: 1.24;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="content-wrapper">
    <div class="profile-layout">
