<!-- VERSION 2.3 — caption set to three even no-wrap lines -->
<!-- Civil War/media-1.html -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Civil War Media</title>

  <style>
    .content-wrapper{
      max-width: 1360px;
      margin: 0 auto;
      padding: 24px 18px 34px;
      color: black;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 20px;
      box-sizing: border-box;
      overflow-wrap: anywhere;
    }

    .profile-layout.photos-top{
      display: flex;
      flex-direction: column;
      gap: 18px;
      align-items: stretch;
    }

    figure.image-block{
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .photo-row{
      display: grid;
      grid-template-columns: auto;
      gap: 0;
      justify-content: center;
      align-items: start;
    }

    .photo-item{
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    img.with-border{
      display: block;
      border: 6px solid black;
      border-radius: 6px;
      box-sizing: border-box;
      filter: sepia(0.20) brightness(1.0) contrast(1)
              drop-shadow(0 0 10px rgba(255, 220, 100, 0.15));
    }

    .photo-item img.with-border{
      width: auto;
      height: auto;
      max-width: 960px;
    }

    .photo-item.first img.with-border{
      max-width: 720px;
      max-height: 700px;
    }

    .caption-line{
      width: min(1280px, calc(100vw - 48px));
      margin: 0 auto;
      font-size: 18px;
      line-height: 1.2;
      color: #333;
      text-align: center;
      overflow-wrap: normal;
    }

    .caption-line span{
      display: block;
      white-space: nowrap;
    }

    .bio-text{
      width: min(980px, 100%);
      margin: 0 auto;
    }

    .bio-text > *:first-child{ margin-top: 0; }

    .bio-text h1{
      margin: 0 0 12px;
      font-size: 34px;
      line-height: 1.08;
      text-align: center;
    }

    @media (max-width: 980px){
      .photo-row{
        grid-template-columns: 1fr;
      }

      .photo-item.first img.with-border,
      .photo-item.second img.with-border{
        max-width: 100%;
      }

      .caption-line{
        width: auto;
        max-width: 100%;
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <div class="content-wrapper">
    <div class="profile-layout photos-top">
      <div class="bio-text">
        <h1>Women in the Great War IV</h1>
      </div>

      <figure class="image-block">
        <div class="photo-row">
          <div class="photo-item first">
            <img
              src="/World War 1/Pictures/Loretta Perfectus Walsh copy.jpg"
              class="with-border"
              alt="Loretta Perfectus Walsh"
            />
            <div class="caption-line">
              <em>
                <span>On 21 Mar 1917, Loretta P. Walsh became the first woman Navy petty officer when she was sworn in as a Chief Yeoman.</span>
                <span>She served at the U.S. Navy Home at the Philadelphia Naval Shipyard, Philadelphia, Pennsylvania, and left the Navy after her four-year enlistment.</span>
                <span>Chief Petty Officer Walsh died on 6 Aug 1925 and is buried at St. Patrick's Cemetery, Olyphant, Pennsylvania.</span>
              </em>
            </div>
          </div>
        </div>
      </figure>
    </div>
  </div>
</body>
</html>
