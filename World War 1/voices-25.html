<!-- VERSION 2.4 — Part 4 title treatment aligned with Parts 2 and 3 -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Women in the Great War - Part 4</title>
  <style>
    .content-wrapper{
      max-width: 1360px;
      margin: 0 auto;
      padding: 24px 18px 34px;
      color: black;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 20px;
      box-sizing: border-box;
      overflow-wrap: anywhere;
    }
    .profile-layout.photos-top{
      display: flex;
      flex-direction: column;
      width: min(1060px, 100%);
      margin: 0 auto;
      gap: 14px;
      align-items: stretch;
    }
    .bio-text{
      width: min(980px, 100%);
      margin: 0 auto;
    }
    .bio-text h1{
      margin: 0 0 4px;
      font-size: 34px;
      line-height: 1.08;
      text-align: left;
    }
    .bio-text h2{
      margin: 0 0 10px;
      font-size: 24px;
      line-height: 1.12;
      font-weight: normal;
      text-align: left;
    }
    figure.image-block{ margin:0; }
    .photo-item{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:8px;
    }
    img.with-border{
      display:block;
      border:6px solid black;
      border-radius:6px;
      box-sizing:border-box;
      filter:sepia(0.20) brightness(1.0) contrast(1) drop-shadow(0 0 10px rgba(255,220,100,.15));
      width:auto;
      height:auto;
      max-width:720px;
      max-height:610px;
    }
    .caption-line{
      width:min(1120px,100%);
      margin:0 auto;
      font-size:18px;
      line-height:1.2;
      color:#333;
      text-align:center;
      font-style:italic;
    }
  </style>
</head>
<body>
  <div class="content-wrapper">
    <div class="profile-layout photos-top">
      <div class="bio-text">
        <h1>Women in the Great War</h1>
        <h2>Part 4</h2>
      </div>

      <figure class="image-block">
        <div class="photo-item">
          <img
            src="/World War 1/Pictures/Loretta Perfectus Walsh copy.jpg"
            class="with-border"
            alt="Loretta Perfectus Walsh"
          />
          <div class="caption-line">
            On 21 Mar 1917, Loretta P. Walsh became the first woman Navy petty officer when she was sworn in as a Chief Yeoman.<br>
            She served at the U.S. Navy Home at the Philadelphia Naval Shipyard, Philadelphia, Pennsylvania, and left the Navy after her four-year enlistment.<br>
            Chief Petty Officer Walsh died on 6 Aug 1925 and is buried at St. Patrick's Cemetery, Olyphant, Pennsylvania.
          </div>
        </div>
      </figure>
    </div>
  </div>
</body>
</html>
