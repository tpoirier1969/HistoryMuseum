<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S.S. Tuscania</title>
  <style>
  * { box-sizing: border-box; }
  body { margin: 0; color: #000; font-family: Arial, Helvetica, sans-serif; }
  .content-wrapper { max-width: 1380px; margin: 0 auto; padding: 24px 18px 36px; font-size: 20px; line-height: 1.24; }
  h1 { margin: 0 0 14px 0; font-size: 34px; line-height: 1.08; }
  h2 { margin: 0 0 12px 0; font-size: 24px; line-height: 1.12; font-weight: normal; }
  p { margin: 0 0 12px 0; }
  .with-border { border: 6px solid #000; border-radius: 6px; box-sizing: border-box; filter: sepia(0.20) brightness(1.0) contrast(1) drop-shadow(0 0 10px rgba(255,220,100,.15)); }
  figure { margin: 0; }
  figcaption { margin-top: 8px; font-size: 18px; line-height: 1.18; text-align: center; color: #222; }
  .two-col { display: grid; grid-template-columns: minmax(0,1fr) minmax(320px,520px); gap: 28px; align-items: center; min-height: 720px; }
  .image-first { grid-template-columns: minmax(320px,520px) minmax(0,1fr); }
  .single { min-height: 720px; display: flex; align-items: center; }
  .single > div { width: 100%; }
  img.fit { display: block; max-width: 100%; max-height: 620px; width: auto; height: auto; margin: 0 auto; }
  .center { text-align: center; }
  .quote { font-size: 20px; line-height: 1.25; }
  .poem { white-space: pre-line; }
  .title-bar { display:flex; align-items:center; gap:18px; flex-wrap:wrap; margin-bottom:12px; }
  .title-audio { width:min(520px,100%); }
  @media (max-width: 1000px){ .two-col, .image-first { grid-template-columns: 1fr; min-height: 0; } .single { min-height: 0; } img.fit { max-height:none; } }
</style>
</head>
<body>

  <div class="content-wrapper two-col image-first">
    <figure><img src="/World War 1/Pictures/Tuscania.jpg" class="with-border fit" alt="S.S. Tuscania"></figure>
    <div>
      <p>On February 5th off the coast of Scotland, a German U-Boat torpedoed the S.S. Tuscania carrying part of the division. While most of the men were saved, the division suffered its first losses of the war.</p>
    </div>
  </div>

</body>
</html>
