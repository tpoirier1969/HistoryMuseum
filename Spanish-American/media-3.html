<!-- Spanish-American/media-3.html -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Spanish–American War • Media 3</title>
  <style>
    .content-wrapper {
      max-width: 1120px;
      margin: 0 auto;
      padding: 10px 15px;
      color: black;
      font-family: sans-serif;
      font-size: 24px;
      box-sizing: border-box;
    }

    .profile-layout {
      min-height: 620px;
      display: grid;
      grid-template-columns: minmax(360px, 440px) minmax(520px, 610px);
      gap: 28px;
      align-items: center;
      justify-content: center;
    }

    img.with-border {
      display: block;
      border: 6px solid black;
      border-radius: 6px;
      filter: sepia(0.20) brightness(1.0) contrast(1)
              drop-shadow(0 0 10px rgba(255, 220, 100, 0.15));
      box-sizing: border-box;
    }

    .portrait img {
      width: min(420px, 100%);
      max-height: 560px;
      object-fit: contain;
    }

    .bio-text {
      font-size: 24px;
      line-height: 1.2;
    }

    .bio-text > *:first-child { margin-top: 0; }

    .remington-art {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin: 0 0 12px;
    }

    .remington-art img {
      width: 100px;
      max-height: 80px;
      object-fit: contain;
    }

    .remington-art figcaption {
      max-width: 210px;
      margin: 0;
      font-size: 15px;
      line-height: 1.08;
      color: #000;
      text-align: left;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="content-wrapper">
    <div class="profile-layout">
      <figure class="portrait" style="margin:0;">
        <img src="/Spanish-American/photos/15-t-roosevelt copy.jpg"
             class="with-border responsive"
             alt="Teddy Roosevelt" />
      </figure>

      <div class="bio-text">
        <figure class="remington-art">
          <img src="/Spanish-American/photos/Charge-Up-San-Juan-Hill copy.jpg"
               class="with-border responsive"
               alt="Frederic Remington’s Charge Up San Juan Hill" />
          <figcaption>Frederic Remington’s <em>Charge Up San Juan Hill</em>.</figcaption>
        </figure>

        <p>
          Frederic Remington, the famous illustrator of the West, was sent to Cuba to supply sketches
          depicting the Spanish atrocities to Hearst’s <em>New York Journal</em>. Remington remained in Cuba
          after war was declared. When Theodore Roosevelt led the famous charge up San Juan Hill,
          Remington documented it.
        </p>
      </div>
    </div>
  </div>
</body>
</html>
