      <h1>Queen City Went Wild With Joy</h1>
      <p>Half the town of Marquette came out to greet the returning soldiers from the Spanish-American War in 1898. Over one hundred soldiers of Company L were met at the train station, and a parade wound its way through town with music and clanging bells.</p>
