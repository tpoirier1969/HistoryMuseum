<div class="ad-fragment"><div class="content-wrapper"><div class="lead-text"><h1>"The Largest Room in the World"<br>Ford's Willow Run Factory</h1><p>Located 35 miles southwest of Detroit</p><p>67 acre building erected in March 1941</p><p>By 1944, one B-24 was completed every 63 minutes</p><p>18,000 B-24s were built, almost 50% at Willow Run.</p></div><div class="gallery one-image"><figure><img src="World War 2/new pics/willowrun.jpg" alt="&quot;The Largest Room in the World&quot; Ford&#x27;s Willow Run Factory"></figure></div></div></div>
