<div class="ad-fragment"><div class="content-wrapper"><div class="lead-text"><h1>Hercules Powder Company</h1><p>Pluto Works, part of the Hercules Powder Co, produced military ordnance, including rocket propellants during the war. The plant received the Army-Navy "E" award in March of 1944. (Located south of Ishpeming in National Mine.)</p></div><div class="gallery one-image"><figure><img src="World War 2/Pictures/Industry-hercules-power-co.jpg" alt="Hercules Powder Company"></figure></div></div></div>
