<div class="ad-fragment"><div class="content-wrapper"><div class="lead-text"><h1>Guarding Important Resources<br>Civil Aircraft Warning Service</h1><p>Volunteers were stationed around the clock to spot and report any aircraft movement. Volunteers included men, women and older high school students. Observations were made at four posts in Marquette County.</p></div><div class="gallery one-image"><figure><img src="World War 2/Pictures/Civil air-on-the-watch.jpg" alt="Guarding Important Resources Civil Aircraft Warning Service"><figcaption>Two unidentified observers on top of Graveraet High School.</figcaption></figure></div></div></div>
