      <h1>Major Glenn Miller, USAAF</h1>
      <p>Glenn Miller was another entertainer who put his successful musical career on hold to take part in the war. He took over the U.S. Army Air Force Band. Sadly, while on his way to a concert in France, his plane crashed and he and his pilot were killed on December 11, 1944.</p>
