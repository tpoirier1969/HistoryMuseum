<div class="ad-fragment"><div class="content-wrapper"><div class="lead-text"><h1>Kelly Johnson</h1><p>Clarence Leonard “Kelly” Johnson of Ishpeming led the team that designed the P-38 Lightning.</p></div><div class="gallery three-images"><figure><img src="World War 2/new pics/Kelly.JPG" alt="Kelly Johnson"></figure><figure><img src="World War 2/new pics/p38.jpg" alt="Lockheed P-38 Lightning"><figcaption>Lockheed P-38 Lightning</figcaption></figure><figure><img src="World War 2/new pics/napalm.jpg" alt="P-38s dropping napalm"><figcaption>Lockheed P-38s dropped napalm fire bombs on enemy positions in the mountains east of Manila. As each bomb hit the target or ground, it would explode and burn everything over an oval-shaped area of approximately 70 by 150 feet. The bombs were effective in eliminating enemy troops in well-dug-in positions.</figcaption></figure></div></div></div>
