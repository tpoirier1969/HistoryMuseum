<div class="ad-fragment"><div class="content-wrapper"><div class="lead-text"><h1>Dress Manufacturers</h1><p>The U.P. Dress Manufacturing Company in Marquette secured a government order to assemble 10,000 white cotton uniforms for nurses. In 1942, the H. A. Satin Company in Negaunee contracted to make 25,000 mosquito nets for troops fighting in the tropics.</p></div><div class="gallery one-image"><figure><img src="World War 2/Pictures/Industry-up-dress-mfg.jpg" alt="Dress Manufacturers"><figcaption>Pictured here are the employees of the U.P. Dress Manufacturing Co. in 1943.</figcaption></figure></div></div></div>
