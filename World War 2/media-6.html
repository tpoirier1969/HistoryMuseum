<div class="ad-fragment"><div class="content-wrapper"><div class="lead-text wide-title"><h1>Marquette was the induction center for the Upper Peninsula</h1><p>This led to a need for food and entertainment as men waited here for a few days. The first Service Center opened on Front St. and later expanded into the city-owned Veterans’ building on Bluff Street. The Palestra also hosted a canteen.</p></div><div class="gallery media6-grid"><figure><img src="World War 2/Pictures/Flanigan- bus.jpg" alt="Marquette was the induction center for the Upper Peninsula" decoding="async"><figcaption>1. Draftees parading to buses in Marquette to be inducted at Traverse City.</figcaption></figure><figure><img src="World War 2/Pictures/DRAFT-marquette-draft-parade.jpg" alt="Marquette was the induction center for the Upper Peninsula" decoding="async"><figcaption>2. Draftee Parade</figcaption></figure><figure><img src="World War 2/Pictures/Flanigan-tuba.jpg" alt="Marquette was the induction center for the Upper Peninsula" decoding="async"><figcaption>3. Draftees’ Parade, ca. 1940, Marquette</figcaption></figure><figure><img src="World War 2/Pictures/social-dance.jpg" alt="Marquette was the induction center for the Upper Peninsula" decoding="async"><figcaption>4. Veterans’ Service Center</figcaption></figure></div></div></div>
