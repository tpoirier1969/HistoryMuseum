<div class="ad-fragment"><div class="content-wrapper"><div class="lead-text"><h1>Bond Drives</h1><p>The Office of Civilian Defense encouraged the buying of war bonds to help fund the war. Drives were held locally and across the nation.</p></div><div class="gallery three-images"><figure><img src="World War 2/Pictures/abbot-costello.jpg" alt="Bond Drives"><figcaption>Abbott and Costello at a bond drive at Memorial Field (in Marquette where the Barry Events Center is currently), in August of 1942.</figcaption></figure><figure><img src="World War 2/Pictures/abbot-costello-war-bonds.jpg" alt="Bond Drives"></figure><figure><img src="World War 2/Pictures/Post-We cant all go.jpg" alt="Bond Drives"></figure></div></div></div>
