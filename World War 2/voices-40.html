<div class="ad-fragment wwii-voices wwii-voices-40">
  <div class="content-wrapper center-stage">
    <section class="lead-text center" style="margin-bottom:14px;">
      <h1>Dana Varvil, Pilot, 210th Coastal Artillery</h1>
    </section>

    <div style="width:min(1120px,100%);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start;justify-items:center;">
      <section style="width:100%;display:flex;flex-direction:column;align-items:center;">
        <h2 style="margin:0 0 10px;text-align:center;">Captured by Romanians</h2>
        <figure style="width:100%;margin:0;display:flex;flex-direction:column;align-items:center;">
          <img src="World War 2/new pics/New 8-8/Varvil-Dana-WWII-MIA-1944.JPG"
               alt="Dana Varvil missing in action, 1944"
               decoding="async"
               style="display:block;width:auto;height:auto;max-width:100%;max-height:360px;object-fit:contain;">
        </figure>
        <div class="audio-block" style="width:100%;margin:12px auto 0;display:flex;justify-content:center;">
          <audio controls preload="metadata" style="display:block;width:min(500px,100%);height:54px;margin:0 auto;">
            <source src="World War 2/Audio/Varvil-Captured.mp3">
          </audio>
        </div>
      </section>

      <section style="width:100%;display:flex;flex-direction:column;align-items:center;">
        <h2 style="margin:0 0 10px;text-align:center;">POW Life</h2>
        <figure style="width:100%;margin:0;display:flex;flex-direction:column;align-items:center;">
          <img src="World War 2/new pics/New 8-8/Varvil-Dana-WWII-POW-1944.JPG"
               alt="Dana Varvil prisoner of war, 1944"
               decoding="async"
               style="display:block;width:auto;height:auto;max-width:100%;max-height:360px;object-fit:contain;">
        </figure>
        <div class="audio-block" style="width:100%;margin:12px auto 0;display:flex;justify-content:center;">
          <audio controls preload="metadata" style="display:block;width:min(500px,100%);height:54px;margin:0 auto;">
            <source src="World War 2/Audio/Varvil-POW Camp-RAF Air Raid.mp3">
          </audio>
        </div>
      </section>
    </div>
  </div>
</div>
