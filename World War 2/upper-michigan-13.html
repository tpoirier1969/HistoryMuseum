<div class="ad-fragment"><div class="content-wrapper"><div class="lead-text"><h1>Rosie the Riveter</h1><p>Women were encouraged to take jobs in all sectors, including war industries, for the war effort. When the war ended, most of these 20 million working American women returned home or to traditional women’s jobs, such as clerical or administrative positions.</p></div><div class="gallery five-landscape"><figure><img src="World War 2/new pics/willowrun.jpg" alt="Rosie the Riveter"></figure><figure><img src="World War 2/Pictures/Industry-rosie-the-riviter.jpg" alt="Rosie the Riveter"></figure><figure><img src="World War 2/Pictures/women-wanted.jpg" alt="Rosie the Riveter"></figure><figure><img src="World War 2/new pics/questions-women-ask1.jpg" alt="Rosie the Riveter"></figure><figure><img src="World War 2/new pics/questions-women-ask2.jpg" alt="Rosie the Riveter"></figure></div></div></div>
