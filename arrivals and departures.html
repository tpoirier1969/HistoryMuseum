<!-- Version 4.23 (credits bookends; visible-audio-control guard) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Arrivals and Departures</title>
  <link rel="stylesheet" href="css/kiosk-layout.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000 url('images/background images/home/arrivals-and-departures working pages background.png') no-repeat center center;
      background-size: cover;
      font-family: sans-serif;
      overflow: hidden;
    }

    #container { display: flex; height: 100%; }
    #sidebar   { width: 220px; padding: 75px 0 0 30px; }
    #rightSide { flex: 1; display: flex; flex-direction: column; }
    #sectionNav{ height: 80px; padding: 18px 0 0 70px; }

    #mainContent {
      flex: 1;
      padding: 0 0 0 120px;
      overflow: hidden;
      position: relative;
      z-index: 1;
      cursor: default;
    }

    #mainContent * { cursor: default; }
    #mainContent > * { position: relative; z-index: 1; }

    img.responsive {
      max-width: 800px;
      max-height: 600px;
      width: auto;
      height: auto;
      display: block;
    }

    #subNavButtons {
      display: flex;
      justify-content: space-between;
      padding: 8px 150px 0 150px;
    }

    #subNavButtons img { height: 60px; cursor: pointer; }

    #mainContent img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    .inactive-glow {
      filter:
        drop-shadow(0 0 8px rgba(70, 45, 20, 0.75))
        drop-shadow(0 0 18px rgba(70, 45, 20, 0.55));
      transition: filter 0.3s ease;
    }

    .active-glow {
      animation: warmPulse 6s infinite;
      transition: filter 0.3s ease;
    }

    @keyframes warmPulse {
      0% {
        filter:
          drop-shadow(0 0 10px rgba(255, 195, 32, 0.72))
          drop-shadow(0 0 18px rgba(255, 195, 32, 0.58))
          drop-shadow(0 0 10px rgba(255, 96, 0, 0.18));
      }
      50% {
        filter:
          drop-shadow(0 0 24px rgba(255, 210, 60, 1.00))
          drop-shadow(0 0 36px rgba(255, 210, 60, 0.78))
          drop-shadow(0 0 22px rgba(255, 96, 0, 0.25));
      }
      100% {
        filter:
          drop-shadow(0 0 10px rgba(255, 195, 32, 0.72))
          drop-shadow(0 0 18px rgba(255, 195, 32, 0.58))
          drop-shadow(0 0 10px rgba(255, 96, 0, 0.18));
      }
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="sidebar">
      <img src="images/background images/home/button-civil.png"  id="btn-civil-war" onclick="switchWar('civil war')" alt="Civil War" />
      <img src="images/background images/home/button-spanish.png" id="btn-spanish"    onclick="switchWar('spanish')" alt="Spanish-American War" />
      <img src="images/background images/home/button-wwi.png"     id="btn-wwi"       onclick="switchWar('wwi')" alt="World War I" />
      <img src="images/background images/home/button-wwii.png"    id="btn-wwii"      onclick="switchWar('wwii')" alt="World War II" />
      <img src="images/background images/home/button-cold.png"    id="btn-cold"      onclick="switchWar('cold')" alt="Cold War" />
    </div>

    <div id="rightSide">
      <div id="sectionNav">
        <img src="images/background images/home/Media and the message.png"  id="section-media"      onclick="switchSection('media')" alt="Media and the Message" />
        <img src="images/background images/home/Voices of veterans.png"     id="section-voices"     onclick="switchSection('voices')" alt="Voices of Veterans" />
        <img src="images/background images/home/technology factors.png"      id="section-technology" onclick="switchSection('technology')" alt="Technology Factors" />
        <img src="images/background images/home/role of upper michigan.png" id="section-upper"      onclick="switchSection('upper')" alt="Role of Upper Michigan" />
        <img src="images/background images/home/arrival home.png"           id="section-arrival"    onclick="switchSection('arrival')" alt="Arrival Home" />
      </div>

      <div id="subNavButtons">
        <img src="images/background images/home/back button.png"    alt="Back"    onclick="navigate(-1)"/>
        <img src="images/background images/home/forward button.png" alt="Forward" onclick="navigate(1)"/>
      </div>

      <div id="mainContent">
        <div class="content-background"></div>
      </div>
    </div>
  </div>

  <script>
    let currentWar = "";
    let currentSection = "media";
    let currentPageIndex = 0;
    let contentMap = {};
    let creditsState = null;
    let introCreditsAvailable = false;

    const WAR_TO_FOLDER = {
      "civil war": "Civil War",
      "spanish": "Spanish-American",
      "wwi": "World War 1",
      "wwii": "World War 2",
      "cold": "Cold War",
      "korea": "Korea",
      "vietnam": "Vietnam"
    };

    const WAR_LABELS = {
      "civil war": "the Civil War",
      "spanish": "the Spanish-American War",
      "wwi": "World War I",
      "wwii": "World War II",
      "cold": "the Cold War",
      "korea": "the Korean War",
      "vietnam": "the Vietnam War"
    };

    const warIdFromKey = (warKey) => `btn-${warKey.replace(/\s+/g,'-')}`;

    function seedInactiveGlow() {
      document.querySelectorAll('#sidebar img, #sectionNav img, #subNavButtons img').forEach(el => {
        el.classList.remove('active-glow');
        el.classList.add('inactive-glow');
      });
    }

    function highlightCurrent(war, section) {
      document.querySelectorAll('#sidebar img, #sectionNav img').forEach(el => {
        el.classList.remove('active-glow');
        if (!el.classList.contains('inactive-glow')) el.classList.add('inactive-glow');
      });

      if (!war) return;

      const activeWarButton = (war === "korea" || war === "vietnam") ? "cold" : war;
      const warBtn = document.getElementById(warIdFromKey(activeWarButton));
      if (warBtn) {
        warBtn.classList.remove('inactive-glow');
        warBtn.classList.add('active-glow');
      }

      if (!section) return;

      const sectionBtn = document.getElementById(`section-${section}`);
      if (sectionBtn) {
        sectionBtn.classList.remove('inactive-glow');
        sectionBtn.classList.add('active-glow');
      }
    }

    function clearCreditsState() {
      creditsState = null;
    }

    function goToKioskPage(war, section = "media", index = 0) {
      currentWar = war;
      currentSection = section;
      currentPageIndex = index;
      clearCreditsState();
      highlightCurrent(currentWar, currentSection);
      loadCurrent();
    }

    function switchWar(war) {
      introCreditsAvailable = false;
      goToKioskPage(war, "media", 0);
    }

    function switchSection(section) {
      if (!currentWar) return;
      introCreditsAvailable = false;
      currentSection = section;
      currentPageIndex = 0;
      clearCreditsState();
      highlightCurrent(currentWar, section);
      loadCurrent();
    }

    function getAvailableSections(war) {
      const sectionOrder = ["media", "voices", "technology", "upper", "arrival"];
      const warMap = contentMap[war] || {};
      return sectionOrder.filter(section => Array.isArray(warMap[section]) && warMap[section].length > 0);
    }

    function goToLastContentPage() {
      const sections = getAvailableSections(currentWar);
      if (!sections.length) return;

      currentSection = sections[sections.length - 1];
      const pages = contentMap[currentWar][currentSection];
      currentPageIndex = pages.length - 1;
      clearCreditsState();
      highlightCurrent(currentWar, currentSection);
      loadCurrent();
    }

    function navigate(offset) {
      if (!currentWar) return;

      if (creditsState === "intro") {
        if (offset < 0) {
          window.location.href = "AandD_Home.html";
          return;
        }

        const sections = getAvailableSections(currentWar);
        if (!sections.length) return;
        currentSection = sections[0];
        currentPageIndex = 0;
        clearCreditsState();
        highlightCurrent(currentWar, currentSection);
        loadCurrent();
        return;
      }

      if (creditsState === "outro") {
        if (offset < 0) {
          goToLastContentPage();
        } else {
          window.location.href = "AandD_Home.html";
        }
        return;
      }

      const sections = getAvailableSections(currentWar);
      if (!sections.length) return;

      if (!sections.includes(currentSection)) {
        currentSection = sections[0];
        currentPageIndex = 0;
        highlightCurrent(currentWar, currentSection);
        loadCurrent();
        return;
      }

      const pages = contentMap[currentWar]?.[currentSection] || [];
      const newIndex = currentPageIndex + offset;

      if (newIndex >= 0 && newIndex < pages.length) {
        currentPageIndex = newIndex;
        loadCurrent();
        return;
      }

      const sectionIndex = sections.indexOf(currentSection);

      if (offset > 0) {
        if (sectionIndex === sections.length - 1) {
          loadCredits("outro");
          return;
        }

        currentSection = sections[sectionIndex + 1];
        currentPageIndex = 0;
        highlightCurrent(currentWar, currentSection);
        loadCurrent();
        return;
      }

      if (sectionIndex === 0) {
        if (introCreditsAvailable) loadCredits("intro");
        return;
      }

      currentSection = sections[sectionIndex - 1];
      const previousPages = contentMap[currentWar][currentSection];
      currentPageIndex = previousPages.length - 1;
      highlightCurrent(currentWar, currentSection);
      loadCurrent();
    }

    function isModernKioskFragment(doc) {
      return !!doc.body.querySelector('.ad-fragment');
    }

    function buildLoadedFragment(html, displayPath) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      const wrapper = document.createElement('div');
      const isModernFragment = isModernKioskFragment(doc);
      const isCustomBridge = !!doc.body.querySelector('.cold-war-menu-panel');

      wrapper.className = isModernFragment
        ? 'kiosk-fragment ad-fragment-host'
        : 'kiosk-fragment legacy-fragment';
      wrapper.dataset.path = displayPath;
      wrapper.dataset.war = currentWar;
      wrapper.dataset.section = currentSection;

      doc.querySelectorAll('script').forEach(node => node.remove());

      if (isModernFragment || isCustomBridge) {
        doc.querySelectorAll('style, link[rel="stylesheet"]').forEach(node => node.remove());
      } else {
        doc.head.querySelectorAll('style').forEach(styleNode => {
          wrapper.appendChild(document.importNode(styleNode, true));
        });
        doc.head.querySelectorAll('link[rel="stylesheet"]').forEach(linkNode => {
          wrapper.appendChild(document.importNode(linkNode, true));
        });
      }

      Array.from(doc.body.childNodes).forEach(node => {
        wrapper.appendChild(document.importNode(node, true));
      });

      if (isCustomBridge) wrapper.classList.add('custom-bridge-fragment');
      return wrapper;
    }

    function normalizeMediaKey(media) {
      const raw = media.getAttribute('src') || media.currentSrc || '';
      if (!raw) return '';
      try {
        return `${media.tagName.toLowerCase()}::${new URL(raw, location.href).pathname.toLowerCase().replace(/%20/g, ' ')}`;
      } catch (_) {
        return `${media.tagName.toLowerCase()}::${raw.toLowerCase().replace(/%20/g, ' ')}`;
      }
    }

    function removeExactDuplicateMedia(container) {
      const seen = new Set();
      container.querySelectorAll('.kiosk-fragment img[src], .kiosk-fragment video[src], .kiosk-fragment audio[src], .kiosk-fragment source[src]').forEach(media => {
        const key = normalizeMediaKey(media);
        if (!key) return;
        if (seen.has(key)) {
          const removable = media.closest('figure, .video-item, .audio-block, .media-link') || media;
          removable.remove();
          return;
        }
        seen.add(key);
      });
    }

    function neutralizeNonNavigationLinks(container) {
      container.querySelectorAll('.kiosk-fragment a[href]').forEach(anchor => {
        const rawHref = anchor.getAttribute('href') || '';
        const href = rawHref.toLowerCase().trim();

        const isAllowedInternalNav =
          anchor.hasAttribute('data-kiosk-nav') ||
          href.startsWith('javascript:go') ||
          href.startsWith('javascript:switch') ||
          href.startsWith('#');

        if (isAllowedInternalNav) return;

        const isDocumentLink = /\.(pdf|doc|docx|xls|xlsx|ppt|pptx|txt)(\?|#|$)/.test(href);
        const isDirectMediaLink = /\.(mp3|wav|m4a|mp4|mov|m4v|f4v|flv)(\?|#|$)/.test(href);
        const isExternalLink = /^https?:\/\//.test(href);

        if (isDocumentLink) {
          anchor.remove();
          return;
        }

        if (isDirectMediaLink || isExternalLink || rawHref) {
          const span = document.createElement('span');
          span.className = anchor.className || (isDirectMediaLink ? 'media-title' : 'kiosk-static-text');
          span.innerHTML = anchor.innerHTML;
          anchor.replaceWith(span);
        }
      });
    }

    function cleanupCaptionQuoteArtifacts(container) {
      container.querySelectorAll('.kiosk-fragment figcaption, .kiosk-fragment .caption, .kiosk-fragment .video-title, .kiosk-fragment .media-title').forEach(caption => {
        const text = caption.textContent.trim();
        const startsWithQuote = text.startsWith('“') || text.startsWith('"');
        const endsWithQuote = text.endsWith('”') || text.endsWith('"');

        if (startsWithQuote && endsWithQuote && text.length > 2) {
          caption.innerHTML = caption.innerHTML
            .replace(/^\s*[“"]/u, '')
            .replace(/[”"]\s*$/u, '');
        }
      });
    }

    function applySharedFragmentCleanup(container) {
      if (!container.querySelector('.kiosk-fragment')) return;
      removeExactDuplicateMedia(container);
      neutralizeNonNavigationLinks(container);
      cleanupCaptionQuoteArtifacts(container);
    }

    function injectFragment(html, displayPath) {
      const container = document.getElementById("mainContent");
      const loadedFragment = buildLoadedFragment(html, displayPath);
      container.innerHTML = '<div class="content-background"></div>';
      container.appendChild(loadedFragment);
      applySharedFragmentCleanup(container);
      scheduleAudioControlVisibilityCheck();
      setTimeout(triggerInjectedAudioAutoplay, 120);
    }

    function ensureAudioControlsVisible() {
      const container = document.getElementById("mainContent");
      if (!container) return true;

      const containerRect = container.getBoundingClientRect();
      let allVisible = true;

      container.querySelectorAll("audio").forEach(audio => {
        audio.controls = true;
        audio.setAttribute("playsinline", "");
        audio.style.display = "block";
        audio.style.width = "min(760px, 100%)";
        audio.style.maxWidth = "100%";
        audio.style.height = "54px";
        audio.style.margin = "0 auto";

        let rect = audio.getBoundingClientRect();
        const visible =
          rect.width > 0 &&
          rect.height > 0 &&
          rect.top >= containerRect.top - 2 &&
          rect.bottom <= containerRect.bottom + 2;

        if (visible) return;

        allVisible = false;

        let block = audio.closest(".audio-block");
        if (!block) {
          block = document.createElement("div");
          block.className = "audio-block";
          audio.parentNode.insertBefore(block, audio);
          block.appendChild(audio);
        }

        block.style.width = "100%";
        block.style.maxWidth = "100%";
        block.style.margin = "5px auto 8px";
        block.style.padding = "0";
        block.style.display = "flex";
        block.style.flexDirection = "column";
        block.style.alignItems = "center";
        block.style.justifyContent = "center";
        block.style.position = "relative";
        block.style.zIndex = "5";

        const fragment = audio.closest(".ad-fragment");
        if (fragment) {
          const heading = fragment.querySelector(".lead-text, .header");
          const wrapper = fragment.querySelector(".content-wrapper") || fragment;

          if (heading && heading.parentNode) {
            heading.insertAdjacentElement("afterend", block);
          } else {
            wrapper.insertBefore(block, wrapper.firstChild);
          }
        }

        rect = audio.getBoundingClientRect();
        if (
          rect.width > 0 &&
          rect.height > 0 &&
          rect.top >= containerRect.top - 2 &&
          rect.bottom <= containerRect.bottom + 2
        ) {
          allVisible = true;
        }
      });

      return allVisible;
    }

    function scheduleAudioControlVisibilityCheck() {
      const container = document.getElementById("mainContent");
      if (!container) return;

      const check = () => ensureAudioControlsVisible();

      requestAnimationFrame(check);
      setTimeout(check, 120);
      setTimeout(check, 500);

      container.querySelectorAll("img").forEach(img => {
        if (!img.complete) img.addEventListener("load", check, { once: true });
      });
    }

    function updateCreditsUrl(mode) {
      const u = new URL(location.href);
      u.searchParams.set("war", currentWar);
      u.searchParams.set("credits", mode);
      u.searchParams.delete("section");
      u.searchParams.delete("index");
      u.hash = "credits";
      history.replaceState(null, "", u);
    }

    function loadCredits(mode) {
      creditsState = mode;
      currentSection = "media";
      currentPageIndex = 0;
      highlightCurrent(currentWar, "");
      updateCreditsUrl(mode);

      fetch("credits.html")
        .then(res => {
          if (!res.ok) throw new Error(`${res.status} credits.html`);
          return res.text();
        })
        .then(html => {
          injectFragment(html, "credits.html");

          const context = document.querySelector("#mainContent .credits-context");
          if (!context) return;

          const warLabel = WAR_LABELS[currentWar] || "this section";
          context.textContent = mode === "intro"
            ? `Press the forward arrow to begin ${warLabel}.`
            : `${warLabel.charAt(0).toUpperCase() + warLabel.slice(1)} complete. Press the forward arrow to return to the main menu.`;
        })
        .catch(() => {
          document.getElementById("mainContent").innerHTML = "<p>Error loading credits.</p>";
        });
    }

    function loadCurrent() {
      const pages = contentMap[currentWar]?.[currentSection];

      if (pages && pages.length > 0) {
        const folder = (typeof WAR_TO_FOLDER !== "undefined" && WAR_TO_FOLDER[currentWar]) || currentWar;
        const file = pages[currentPageIndex];
        const url = `${folder}/${file}`;
        const displayPath = `${folder}/${file}`;

        const u = new URL(location.href);
        u.searchParams.set("war", currentWar);
        u.searchParams.set("section", currentSection);
        u.searchParams.set("index", String(currentPageIndex));
        u.searchParams.delete("credits");
        u.hash = encodeURIComponent(displayPath);
        history.replaceState(null, "", u);

        fetch(url)
          .then(res => {
            if (!res.ok) throw new Error(`${res.status} ${url}`);
            return res.text();
          })
          .then(html => injectFragment(html, displayPath))
          .catch(() => {
            document.getElementById("mainContent").innerHTML = "<p>Error loading content.</p>";
          });
      }
    }

    function triggerInjectedAudioAutoplay() {
      const audio = document.querySelector("#mainContent audio");
      const audioEnabled = localStorage.getItem("audio-enabled");

      if (!audio) return;

      ensureAudioControlsVisible();

      if (audioEnabled === "true") {
        const container = document.getElementById("mainContent");
        const containerRect = container.getBoundingClientRect();
        const rect = audio.getBoundingClientRect();
        const controlsVisible =
          rect.width > 0 &&
          rect.height > 0 &&
          rect.top >= containerRect.top - 2 &&
          rect.bottom <= containerRect.bottom + 2;

        if (controlsVisible) {
          audio.muted = false;
          audio.play().catch(() => {});
        }
      }
    }

    function arrivedFromHome() {
      const navigation = performance.getEntriesByType("navigation")[0];
      if (navigation && navigation.type === "reload") return false;
      if (!document.referrer) return false;

      try {
        const referrer = new URL(document.referrer);
        return decodeURIComponent(referrer.pathname).toLowerCase().endsWith("/aandd_home.html");
      } catch (_) {
        return false;
      }
    }

    fetch('contentMap.json')
      .then(res => res.json())
      .then(data => {
        contentMap = data;
        const params = new URLSearchParams(location.search);
        const requestedWar = params.get("war");
        const requestedCredits = params.get("credits");

        seedInactiveGlow();

        if (!requestedWar) {
          window.location.replace("AandD_Home.html");
          return;
        }

        currentWar = requestedWar;

        if (requestedCredits === "intro") {
          introCreditsAvailable = true;
          loadCredits("intro");
          return;
        }

        if (requestedCredits === "outro") {
          loadCredits("outro");
          return;
        }

        if (arrivedFromHome()) {
          introCreditsAvailable = true;
          loadCredits("intro");
          return;
        }

        const section = params.get("section") || "media";
        const index = parseInt(params.get("index") || "0", 10);

        currentSection = section;
        currentPageIndex = Number.isFinite(index) ? index : 0;

        highlightCurrent(currentWar, currentSection);
        loadCurrent();
      });
  </script>
</body>
</html>
