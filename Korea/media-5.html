<style>
.ad-fragment {
  box-sizing: border-box;
  max-width: 1260px;
  margin: 0 auto;
  padding: 10px 18px 16px;
  color: #000;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 20px;
  line-height: 1.3;
}
.ad-fragment * { box-sizing: border-box; }
.ad-fragment h1 {
  margin: 0;
  color: #000;
  font-size: 34px;
  line-height: 1.08;
  font-weight: 700;
  text-align: center;
}
.content-wrapper {
  max-width: 1040px;
  height: min(700px, calc(100vh - 225px));
  min-height: 0;
  margin: 0 auto;
  display: grid;
  grid-template-rows: auto 1fr;
  gap: 10px;
  text-align: center;
}
.visual-area {
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.image-stack {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: center;
}
figure {
  margin: 0;
  padding: 0;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}
figure img {
  display: block;
  width: auto;
  max-width: 100%;
  height: auto;
  object-fit: contain;
  border: 6px solid #111;
  border-radius: 6px;
  margin-bottom: 0 !important;
  filter: sepia(0.2) brightness(1) contrast(1) drop-shadow(0 0 10px rgba(255,220,100,.15));
}
.headline-img { max-height: 175px; }
.scene-img { max-height: 350px; }
@media (max-width: 1050px) {
  .content-wrapper { height: auto; display: block; }
}
</style>
<div class="ad-fragment media-5-panel">
  <div class="content-wrapper">
    <h1>Armistice Negotiations<br>July 1951 – July 1953</h1>
    <div class="visual-area">
      <div class="image-stack">
        <figure>
          <img class="with-border responsive headline-img" src="Korea/Pictures/HD-armistice.jpg" alt="Signing of Korean Armistice reported only matter of hours">
        </figure>
        <figure>
          <img class="with-border responsive scene-img" src="Korea/Pictures/Armistice.jpg" alt="Armistice negotiations in Korea">
        </figure>
      </div>
    </div>
  </div>
</div>
