<style>
.ad-fragment {
  box-sizing: border-box;
  max-width: 1260px;
  margin: 0 auto;
  padding: 12px 18px 22px;
  color: #000;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 20px;
  line-height: 1.32;
}
.ad-fragment * {
  box-sizing: border-box;
}
.ad-fragment h1 {
  margin: 0 0 14px;
  color: #000;
  font-size: 34px;
  line-height: 1.08;
  font-weight: 700;
}
.ad-fragment p {
  margin: 0 0 14px;
}
.content-wrapper {
  max-width: 1180px;
  margin: 0 auto;
}
.kiosk-text {
  max-width: 1080px;
  margin: 0 auto 20px;
}
.image-row {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 22px 34px;
  align-items: start;
  justify-items: center;
}
.image-stack {
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: center;
}
figure {
  margin: 0;
  padding: 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}
figure img,
.with-border {
  display: block;
  width: auto;
  height: auto;
  max-width: 100%;
  border: 6px solid #111;
  border-radius: 6px;
  margin-bottom: 0 !important;
}
figcaption,
.caption {
  display: block;
  margin: 7px 0 0;
  padding: 0;
  color: #000;
  font-size: 17px;
  line-height: 1.18;
  font-style: italic;
  text-align: center;
}
@media (max-width: 1050px) {
  .image-row {
    grid-template-columns: 1fr;
  }
  .ad-fragment {
    font-size: 19px;
  }
}
</style>
<div class="ad-fragment media-6-panel">
  <style>
    .media-6-panel .content-wrapper {
      max-width: 880px;
      margin: 0 auto;
      text-align: center;
    }
    .media-6-panel h1 {
      margin-bottom: 12px;
      text-align: center;
    }
    .media-6-panel .headline-img {
      width: auto;
      max-width: 860px;
      max-height: 470px;
    }
    .media-6-panel figcaption {
      max-width: 860px;
      margin: 8px auto 0;
      text-align: center;
    }
    .media-6-panel .body-copy {
      margin: 22px auto 0;
      max-width: 860px;
      text-align: center;
    }
  </style>
  <div class="content-wrapper">
    <h1>Korean War</h1>
    <figure>
      <img class="with-border responsive headline-img" src="Korea/Pictures/HD-Atomic Bomb-641.jpg" alt="Daily Mining Journal headline about the atomic bomb being used against Japan">
      <figcaption>The Daily Mining Journal announces the use of the atomic bomb against Japan, August 7, 1945.</figcaption>
    </figure>
    <p class="body-copy">July 27, 1953 The war ends after Stalin dies and newly elected President Eisenhower considers the use of atomic weapons to end the war.</p>
  </div>
</div>
