<style>
.ad-fragment {
  box-sizing: border-box;
  max-width: 1260px;
  margin: 0 auto;
  padding: 12px 18px 22px;
  color: #000;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 20px;
  line-height: 1.32;
}
.ad-fragment * {
  box-sizing: border-box;
}
.ad-fragment h1 {
  margin: 0 0 14px;
  color: #000;
  font-size: 34px;
  line-height: 1.08;
  font-weight: 700;
}
.ad-fragment p {
  margin: 0 0 14px;
}
.content-wrapper {
  max-width: 1180px;
  margin: 0 auto;
}
.kiosk-text {
  max-width: 1080px;
  margin: 0 auto 20px;
}
.image-row {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 22px 34px;
  align-items: start;
  justify-items: center;
}
.image-stack {
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: center;
}
figure {
  margin: 0;
  padding: 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}
figure img,
.with-border {
  display: block;
  width: auto;
  height: auto;
  max-width: 100%;
  border: 6px solid #111;
  border-radius: 6px;
  margin-bottom: 0 !important;
}
figcaption,
.caption {
  display: block;
  margin: 7px 0 0;
  padding: 0;
  color: #000;
  font-size: 17px;
  line-height: 1.18;
  font-style: italic;
  text-align: center;
}
@media (max-width: 1050px) {
  .image-row {
    grid-template-columns: 1fr;
  }
  .ad-fragment {
    font-size: 19px;
  }
}
</style>
<div class="ad-fragment technology-2-panel">
  <style>
    .technology-2-panel {
      padding-top: 10px;
    }
    .technology-2-panel .content-wrapper {
      max-width: 1040px;
      margin: 0 auto;
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 18px;
      min-height: calc(100vh - 230px);
      align-items: center;
    }
    .technology-2-panel .plane-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 0;
      text-align: center;
    }
    .technology-2-panel h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 32px;
    }
    .technology-2-panel img {
      max-width: 880px;
      max-height: 255px;
      width: auto;
      height: auto;
    }
    @media (max-width: 1050px) {
      .technology-2-panel .content-wrapper {
        min-height: 0;
      }
    }
  </style>
  <div class="content-wrapper">
    <section class="plane-block">
      <h1>North American F-86 Sabre</h1>
      <figure>
        <img class="with-border responsive" src="Korea/Pictures/F86.jpg" alt="North American F-86 Sabre">
      </figure>
    </section>
    <section class="plane-block">
      <h1>Mikoyan-Gurevich MiG-15</h1>
      <figure>
        <img class="with-border responsive" src="Korea/Pictures/mig.jpg" alt="Mikoyan-Gurevich MiG-15">
      </figure>
    </section>
  </div>
</div>
