<style>
.ad-fragment {
  box-sizing: border-box;
  max-width: 1260px;
  margin: 0 auto;
  padding: 12px 18px 22px;
  color: #000;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 20px;
  line-height: 1.32;
}
.ad-fragment * {
  box-sizing: border-box;
}
.ad-fragment h1 {
  margin: 0 0 14px;
  color: #000;
  font-size: 34px;
  line-height: 1.08;
  font-weight: 700;
}
.ad-fragment p {
  margin: 0 0 14px;
}
.content-wrapper {
  max-width: 1180px;
  margin: 0 auto;
}
.kiosk-text {
  max-width: 1080px;
  margin: 0 auto 20px;
}
.image-row {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 22px 34px;
  align-items: start;
  justify-items: center;
}
.image-stack {
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: center;
}
figure {
  margin: 0;
  padding: 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}
figure img,
.with-border {
  display: block;
  width: auto;
  height: auto;
  max-width: 100%;
  border: 6px solid #111;
  border-radius: 6px;
  margin-bottom: 0 !important;
}
figcaption,
.caption {
  display: block;
  margin: 7px 0 0;
  padding: 0;
  color: #000;
  font-size: 17px;
  line-height: 1.18;
  font-style: italic;
  text-align: center;
}
@media (max-width: 1050px) {
  .image-row {
    grid-template-columns: 1fr;
  }
  .ad-fragment {
    font-size: 19px;
  }
}
</style>
<div class="ad-fragment media-7-panel">
  <style>
    .media-7-panel {
      padding-top: 6px;
      padding-bottom: 8px;
    }
    .media-7-panel .content-wrapper {
      max-width: 1180px;
      height: calc(100vh - 205px);
      min-height: 610px;
    }
    .media-7-panel .propaganda-layout {
      height: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 24px;
    }
    .media-7-panel figure {
      height: 100%;
      align-items: flex-start;
      justify-content: flex-start;
    }
    .media-7-panel img {
      max-height: 100%;
      max-width: 820px;
      width: auto;
      height: auto;
    }
    .media-7-panel .side-copy {
      width: 330px;
      padding-top: 0;
      text-align: left;
    }
    .media-7-panel h1 {
      margin: 0 0 10px;
      text-align: left;
    }
    .media-7-panel .caption {
      text-align: left;
      max-width: 330px;
    }
    @media (max-width: 1050px) {
      .media-7-panel .content-wrapper {
        height: auto;
        min-height: 0;
      }
      .media-7-panel .propaganda-layout {
        display: block;
      }
      .media-7-panel .side-copy {
        width: auto;
        padding-top: 12px;
      }
    }
  </style>
  <div class="content-wrapper propaganda-layout">
    <figure>
      <img class="with-border responsive" src="Korea/Pictures/flyer.jpg" alt="North Korean propaganda flyer">
    </figure>
    <section class="side-copy">
      <h1>North Korean Propaganda</h1>
      <div class="caption">Shows the end of US aggressors: Dean, Walker, Mac Arthur, Clark, Ridgway and Van Fleet</div>
    </section>
  </div>
</div>
